name: Deploy Angular App to Cloud Run

on:
  push:
    branches: [ "main" ]   # Deploy only when pushing to main

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repo
      uses: actions/checkout@v3

    - name: Google Auth
      uses: google-github-actions/auth@v2
      with:
        credentials_json: ${{ secrets.GCP_SA_KEY }}

    - name: Setup gcloud
      uses: google-github-actions/setup-gcloud@v2

    - name: Build & Push Docker Image
      run: |
        gcloud auth configure-docker REGION-docker.pkg.dev --quiet
        docker build -t REGION-docker.pkg.dev/PROJECT_ID/REPO_NAME/college-site:$GITHUB_SHA .
        docker push REGION-docker.pkg.dev/PROJECT_ID/REPO_NAME/college-site:$GITHUB_SHA

    - name: Deploy to Cloud Run
      run: |
        gcloud run deploy college-site \
          --image REGION-docker.pkg.dev/PROJECT_ID/REPO_NAME/college-site:$GITHUB_SHA \
          --region REGION \
          --platform managed \
          --allow-unauthenticated
