<footer class="footer-bg-color border-top p-3 p-sm-5">
  <div
    class="d-flex flex-column flex-lg-row justify-content-between gap-4 gap-sm-1"
  >
    <div class="d-flex flex-column gap-4 w-400">
      <img src="assets/external/footer-college-logo.png" class="footer-img w-100" />
      <a
        href="https://maps.app.goo.gl/gegv8Qu4acpqhu258"
        target="_blank"
        class="text-decoration-none"
        ><div class="fs-5 fs-9 text-white">
          CA Site No. 6 & 7,3rd Main, Pipeline Road, Chord Rd, adj. to Mahalakshmi Metro Station, 2nd Phase, Stage 2, Mahalakshmipuram, Bengaluru, Karnataka 560086
        </div></a
      >
    </div>
    <div class="d-flex flex-column gap-3 fs-4 fs-9 text-nowrap py-3">
      <a routerLink="/about" class="text-white text-decoration-none w-sm-fit"
        >About Us</a
      >
      <a routerLink="/people" class="text-white text-decoration-none w-sm-fit"
        >People</a
      >
      <a routerLink="/academics" class="text-white text-decoration-none w-sm-fit"
        >Academics</a
      >
      <a routerLink="/campus" class="text-white text-decoration-none w-sm-fit"
        >Campus life</a
      >
      <a routerLink="/contact" class="text-white text-decoration-none w-sm-fit"
        >Contact</a
      >
    </div>
    <div class="d-flex flex-column gap-5">
      <div class="d-flex flex-column gap-3 text-white fs-4 fs-9">
        <div class="fw-bold text-white">BGSCET | MBA</div>
        <div class="text-nowrap">
          Contact :
          <a [href]="'tel:' + mobile" class="text-white text-decoration-none"
            >+{{ mobile }}</a
          >
        </div>
        <div class="text-nowrap">
          Email :
          <a
            [href]="'mailto:' + email"
            class="text-white text-decoration-none"
            >{{ email }}</a
          >
        </div>
      </div>
      <!-- Social Icons -->
      <div class="d-flex justify-content-between">
        <a href="https://www.instagram.com/bgscet_mba/" target="_blank"
          ><img
            class="w-75"
            src="assets/external/instagram-icon.png"
            alt="Instagram"
        /></a>
        <a
          href="https://www.facebook.com/profile.php?id=61565065263331"
          target="_blank"
          ><img
            class="w-75"
            src="assets/external/facebook-icon.png"
            alt="Facebook"
        /></a>
        <a href="https://x.com/" target="_blank"
          ><img class="w-75" src="assets/external/twitter-icon.png" alt="X"
        /></a>
        <a
          href="http://www.linkedin.com/in/bgscet-mba-001453282"
          target="_blank"
          ><img
            class="w-75"
            src="assets/external/linkedin-icon.png"
            alt="LinkedIn"
        /></a>
        <a href="https://mail.google.com/" target="_blank"
          ><img class="w-75" src="assets/external/gmail-icon.png" alt="Gmail"
        /></a>
      </div>
    </div>
  </div>
</footer>
<div class="p-3 text-white text-center bg-blue-color">
  <span class="fs-sm-5 fs-9 text-white">copyrights @ BGSCET|MBA</span>
</div>
