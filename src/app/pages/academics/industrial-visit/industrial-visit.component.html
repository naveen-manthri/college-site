<div class="d-flex flex-column gap-5 p-5">
    <div class="underline fw-bold fs-1 text-heading-color align-self-center w-fit">Industrial Visit</div>
    <div class="d-flex justify-content-center align-items-center w-100 gap-5 flex-wrap p-5">
        <div *ngFor="let industry of industries" class="d-flex flex-column justify-content-center align-items-center gap-4">
            <img [src]="industry.url" [alt]="industry.alt || 'Industry Image'" class="cl-dim"/>
            <button class="btn bg-blue-color d-block mx-auto py-2 px-3 fs-5 fw-bold text-white" (click)="openLink(industry.link)">{{industry.linkText}}</button>
        </div>
    </div>
</div>
